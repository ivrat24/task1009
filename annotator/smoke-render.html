<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>IR-02 render smoke test</title>
  <link rel="stylesheet" href="./vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    body { padding: 24px; max-width: 820px; margin: 0 auto; }
    .ok { color: #1f4d3f; }
    .bad { color: #8a1f1f; }
  </style>
</head>
<body>
  <h1>Render smoke test</h1>
  <p id="libs"></p>
  <div class="bubble user" style="margin:16px 0">
    <div class="who"><span>fixture</span></div>
    <div class="bubble-body" id="out"></div>
  </div>
  <script src="./vendor/katex/katex.min.js"></script>
  <script src="./vendor/katex/auto-render.min.js"></script>
  <script src="./vendor/marked.min.js"></script>
  <script>
    const sample = `# Plan: Auto-Continue

## Context

**Diagnosis:** model stopped at iteration 12.

Inline math $E=mc^2$ and display:

$$\\int_0^1 x^2\\\\,dx = \\\\frac{1}{3}$$

\`\`\`js
console.log("code fence")
\`\`\`
`;
    const libs = document.getElementById("libs");
    const hasMarked = !!(window.marked && (marked.parse || marked.marked));
    const hasKatex = typeof katex !== "undefined";
    libs.innerHTML = `marked: <b class="${hasMarked ? "ok" : "bad"}">${hasMarked}</b> · katex: <b class="${hasKatex ? "ok" : "bad"}">${hasKatex}</b>`;
    const parse = marked.parse || marked.marked;
    const html = parse(sample, { breaks: true, gfm: true, async: false });
    const out = document.getElementById("out");
    out.innerHTML = `<div class="md" data-rich="1">${html}</div>`;
    renderMathInElement(out, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "$", right: "$", display: false },
      ],
      throwOnError: false,
      ignoredTags: ["pre", "code"],
    });
    // Fail loudly if hashes remain
    if (out.innerText.includes("# Plan") || out.innerText.includes("**Diagnosis**")) {
      libs.innerHTML += ` · <span class="bad">FAIL: raw markdown still visible</span>`;
    } else {
      libs.innerHTML += ` · <span class="ok">PASS: headings/bold rendered</span>`;
    }
  </script>
</body>
</html>
